<!-- templates/volunteer_card.html -->
<div class="volunteer-block" style="margin-bottom: 5px;">
    <a href="{act_url}" target="_blank" style="
        text-decoration: none;
        color: #0a66c2;
        font-weight: 500;
        font-size: 1.1rem;">{act_name}</a><br>
    <span style="font-size: 1rem; color: #191919;">{act_description}</span><br>
    <span style="font-size: 1rem; color: #191919;">{act_position}</span><br>
    <span style="color: #666666; font-size: 1rem;">{act_period}</span>
    <div class="job-skills" style="margin-top: 6px; font-size: 0.95rem; color: #191919;">
        <strong>Ключевые навыки:</strong> {act_skills}
    </div>
</div>
