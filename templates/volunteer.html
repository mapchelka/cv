<!-- templates/volunteer_card.html -->
<div class="volunteer-block" style="margin-bottom: 5px;">
    <a href="{act_url}" target="_blank" style="
        text-decoration: none;
        color: #0a66c2;
        font-weight: 500;
        font-size: 1.1rem;">{act_name}</a><br>

    <span class="volunteer-desc" style="
        font-size: 0.9rem;
        color: #666666;
        font-style: italic;
        margin-top: 1px;
        margin-bottom: 4px;
        line-height: 1.2;">
        {act_description}
    </span><br>

    <strong style="font-size: 1rem; color: #474747;">{act_position}</strong><br>
    <span style="color: #666666; font-size: 1rem;">{act_period}</span>
    {act_skills}
</div>
